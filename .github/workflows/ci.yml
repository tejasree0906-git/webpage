name: webpage CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check HTML File
        run: test -f index.html

      - name: Display Success Message
        run: echo "CI completed successfully"
